    <h1 class="section-title">Contact</h1>
    <p>Interested in working together? Send a message and I'll get back to you.</p>

    <!--
      Powered by Formspree (https://formspree.io) — a free tier handles
      low-volume static-site forms with no backend of your own. Sign up,
      create a form, and replace YOUR_FORM_ID below with the endpoint it
      gives you before this goes live.
    -->
    <form class="contact-form" action="https://formspree.io/f/myezewyl" method="POST">
      <div>
        <label for="contact-name">Name</label>
        <input type="text" id="contact-name" name="name" autocomplete="name" required>
      </div>
      <div>
        <label for="contact-email">Email</label>
        <input type="email" id="contact-email" name="_replyto" autocomplete="email" required>
      </div>
      <div>
        <label for="contact-message">Message</label>
        <textarea id="contact-message" name="message" required></textarea>
      </div>
      <input type="text" name="_gotcha" style="display:none" tabindex="-1" autocomplete="off">
      <button type="submit">Send Message</button>
    </form>

    <div class="social-links">
      <a href="https://www.instagram.com/wlcworks" target="_blank" rel="noopener">Instagram</a>
      <a href="https://www.flickr.com/photos/196068418@N02/" target="_blank" rel="noopener">Flickr</a>
    </div>
  </section>
